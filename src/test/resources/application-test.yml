spring:
  datasource:
    url: jdbc:h2:mem:wedit-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client
            client-secret: test-google-secret
          kakao:
            client-id: test-kakao-client
            client-secret: test-kakao-secret
            redirect-uri: "http://localhost:8080/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-name: Kakao
            scope:
              - profile_nickname
              - account_email
            client-authentication-method: none
          naver:
            client-id: test-naver-client
            client-secret: test-naver-secret
            redirect-uri: "http://localhost:8080/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            scope:
              - name
              - profile
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: "https://nid.naver.com/oauth2.0/authorize"
            token-uri: "https://nid.naver.com/oauth2.0/token"
            user-info-uri: "https://openapi.naver.com/v1/nid/me"
            user-name-attribute: response

app:
  oauth2:
    authorized-redirect-uri: http://localhost:3000/oauth2/redirect
    apple:
      team-id:
      key-id:
      private-key:

jwt:
  access:
    header: Authorization
    expiration: 3600000
  refresh:
    header: X-Refresh-Token
    expiration: 5259400000
  secretKey: vTfT4bFjiaZWnjeikZXutfgX+LmLRB4iP5AN+FUWpTeqGDXgQbXDhYd9j5BA3DcDuyfGp+leNDtiJl2ilmxRjA==

logging:
  level:
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

cloud:
  aws:
    region:
      static: ap-northeast-2
    s3:
      bucket: test-bucket
      presign:
        expiration-minutes: 10
    cloudfront:
      url: https://cdn.test.wedit.local
