# ─── 테스트 공통 설정 ─────────────────────────────────────────────────────────
# @DataJpaTest: spring.datasource.url 은 자동으로 H2 로 교체되므로 여기서 지정하지 않음
# @SpringBootTest(contextLoads): AWS 지역 값만 더미로 지정하여 AwsS3Config Bean 생성 가능하게 함
#                                실제 AWS 요청은 테스트에서 발생하지 않으므로 자격 증명 없이도 동작함
cloud.aws.region.static=ap-northeast-2

# @SpringBootTest(contextLoads) 전용
# ddl-auto: update 는 기존 테이블에 NOT NULL datetime 컬럼 추가 시 MySQL Strict Mode 에러를 유발함
# 테스트에서는 스키마 변경 없이 Bean 생성만 검증하므로 none 으로 비활성화
# @DataJpaTest 는 자체적으로 create-drop + H2 를 사용하므로 이 설정에 영향받지 않음
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
