checkstyle {
    toolVersion = '10.17.0'
    configFile = file('gradle/checkstyle/checkstyle.xml')
    ignoreFailures = false
}

tasks.register('shellTest', Exec) {
    group = 'verification'
    description = 'Runs shell-based workflow and hook tests.'
    commandLine 'bash', 'scripts/tests/run.sh'
    inputs.files(fileTree('scripts') {
        include '**/*.sh'
    }, fileTree('.githooks') {
        include '**/*'
    })
}

tasks.register('ciDockerImageBuild', Exec) {
    group = 'verification'
    description = 'Builds the application Docker image so CI-only packaging failures are caught by the harness.'
    commandLine 'bash', 'scripts/ci/build-docker-image.sh', "wedit-backend-harness:${project.version}"
    dependsOn tasks.named('copyConfig')

    inputs.file('Dockerfile')
    inputs.file('gradlew')
    inputs.files(fileTree('gradle') {
        include '**/*'
    })
    inputs.files(fileTree('scripts/ci') {
        include '**/*.sh'
    })
    inputs.files(fileTree('src') {
        include '**/*'
    })
    inputs.files(fileTree('config/src/main/resources') {
        include '**/*'
    })
    outputs.upToDateWhen { false }
}

tasks.named('check') {
    dependsOn tasks.named('shellTest')
    dependsOn tasks.named('ciDockerImageBuild')
}
